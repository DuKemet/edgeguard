# Example only. Do not commit real values. Create the real secret out of band, e.g.:
#   kubectl -n edgeguard create secret generic edgeguard-secrets \
#     --from-literal=JWT_SECRET="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')" \
#     --from-literal=CLIENT_HASH_SECRET="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')" \
#     --from-literal=ADMIN_PASSWORD_HASH="$(npm run --silent hash-password -- 'your-password')"
apiVersion: v1
kind: Secret
metadata:
  name: edgeguard-secrets
  namespace: edgeguard
  labels:
    app.kubernetes.io/part-of: edgeguard
type: Opaque
stringData:
  JWT_SECRET: replace-me-with-at-least-32-random-characters
  CLIENT_HASH_SECRET: replace-me-with-at-least-32-random-characters
  ADMIN_PASSWORD_HASH: replace-me-with-a-bcrypt-hash
