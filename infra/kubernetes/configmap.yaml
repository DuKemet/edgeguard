apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: edgeguard
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: edgeguard
data:
  NODE_ENV: production
  PORT: "8080"
  HOST: 0.0.0.0
  LOG_LEVEL: info
  REDIS_URL: redis://redis:6379
  REDIS_PREFIX: edgeguard
  REDIS_REQUIRED: "true"
  REDIS_CONNECT_TIMEOUT_MS: "1500"
  REDIS_COMMAND_TIMEOUT_MS: "750"
  UPSTREAM_URL: http://demo-api:4000
  UPSTREAM_ALLOWED_HOSTS: demo-api
  ALLOW_PRIVATE_UPSTREAMS: "true"
  UPSTREAM_TIMEOUT_MS: "10000"
  MAX_RESPONSE_BYTES: "5242880"
  MAX_REQUEST_BYTES: "1048576"
  MAX_PATH_LENGTH: "2048"
  JWT_ISSUER: edgeguard
  JWT_AUDIENCE: edgeguard-dashboard
  TOKEN_TTL_SECONDS: "3600"
  ADMIN_USERNAME: admin
  CORS_ORIGINS: https://dashboard.example.com
  TRUST_PROXY: "1"
  METRICS_TOKEN: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-api-config
  namespace: edgeguard
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/part-of: edgeguard
data:
  NODE_ENV: production
  DEMO_PORT: "4000"
